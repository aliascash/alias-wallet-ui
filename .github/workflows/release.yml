# DECISION LOG
# Trigger: push to main + workflow_dispatch (swap to workflow_run/repository_dispatch once daemon CI is live).
# Daemon: pin with the daemon_tag workflow input or repo var DAEMON_TAG (e.g. Build54);
#   defaults to DEFAULT_DAEMON_TAG in this file; last resort is the daemon repo latest FULL release.
#   Daemon assets are named ALIAS-<release>-<sha>-Win64.zip / Mac.zip / Linux.zip.
# Signing: optional — CSC_LINK + CSC_KEY_PASSWORD enable it; unsigned builds trigger SmartScreen/Gatekeeper warnings.
# Auth: GITHUB_TOKEN covers this repo; swap GH_TOKEN to a PAT (secrets.DAEMON_REPO_PAT) if daemon repo is private/cross-org.

name: Build and Release Installers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      daemon_tag:
        description: >-
          Daemon release tag to bundle (e.g. Build54). Leave empty to use the
          repo variable DAEMON_TAG, else DEFAULT_DAEMON_TAG pinned in this workflow.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            daemon_pattern: "*Win64.zip"
            stage_dir: resources/win32/x64
            daemon_bin: aliaswalletd.exe
            build_script: build:win
            artifact_glob: "dist/ALIAS*.exe"

          - os: macos-latest
            daemon_pattern: "*Mac.zip"
            stage_dir: resources/darwin/x64
            daemon_bin: aliaswalletd
            build_script: build:mac
            artifact_glob: "dist/*.dmg"

          - os: ubuntu-latest
            daemon_pattern: "*Linux.zip"
            stage_dir: resources/linux/x64
            daemon_bin: aliaswalletd
            build_script: build:linux
            # multiline so softprops/action-gh-release (splits files on newlines) uploads both
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}

    env:
      # Daemon build bundled by a plain push to main. Pinned in-repo so the
      # build is reproducible and cannot silently fall back to the newest
      # FULL release (4.4.x) — the develop pipeline publishes prereleases,
      # which `gh release view` does not consider latest. Override per-run
      # with the daemon_tag input, or repo-wide with the DAEMON_TAG variable.
      DEFAULT_DAEMON_TAG: Build55
      # The daemon repo is separate, so the repo-scoped
      # GITHUB_TOKEN cannot read its releases. Use a PAT (repo:read on
      # the daemon repo) stored as secret DAEMON_REPO_PAT; fall back to
      # GITHUB_TOKEN only if the PAT is unset (same-repo/public case).
      GH_TOKEN: ${{ secrets.DAEMON_REPO_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      # Stage the daemon binary before electron-builder runs so that the
      # extraResources rule copies it into the packaged app's daemon/ directory.
      # The path resources/${platform}/${arch}/ matches the electron-builder config:
      #   from: "resources/${platform}/${arch}" -> to: "daemon"
      # `gh release download` with no --tag resolves to the repo's *latest*
      # release, which excludes prereleases. The daemon's develop pipeline
      # publishes prereleases (Build<n>), so without an explicit tag this
      # silently bundles the last full release (4.4.x) instead of the build
      # the UI was tested against. Resolve the tag explicitly.
      - name: Resolve daemon release tag
        id: daemon_tag
        shell: bash
        run: |
          tag="${{ inputs.daemon_tag || vars.DAEMON_TAG || env.DEFAULT_DAEMON_TAG }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view \
                    --repo ${{ vars.DAEMON_REPO || 'aliascash/alias-wallet' }} \
                    --json tagName --jq .tagName)
            echo "No pinned tag; falling back to latest full release: $tag"
          else
            echo "Using pinned daemon tag: $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download daemon release asset
        shell: bash
        run: |
          gh release download "${{ steps.daemon_tag.outputs.tag }}" \
            --repo ${{ vars.DAEMON_REPO || 'aliascash/alias-wallet' }} \
            --pattern "${{ matrix.daemon_pattern }}" \
            --dir daemon-asset

      - name: Stage daemon binary
        shell: bash
        run: |
          mkdir -p "${{ matrix.stage_dir }}"

          # Find the downloaded archive (zip or tar.gz).
          archive=$(find daemon-asset -type f \( -name "*.zip" -o -name "*.tar.gz" \) | head -1)
          if [ -z "$archive" ]; then
            echo "ERROR: no archive found in daemon-asset/ matching ${{ matrix.daemon_pattern }}"
            exit 1
          fi

          # Extract into a staging directory.
          #
          # Do not extract zips with `unzip`. The Windows daemon archive is
          # built by PowerShell Compress-Archive, which writes entry names with
          # BACKSLASH separators ("ALIAS\\aliaswalletd.exe"). Info-ZIP on the
          # Windows runner prints
          #     warning: ... appears to use backslashes as path separators
          # and returns exit status 1 ("warning error") even though extraction
          # succeeded. This step runs under `bash -e`, so that non-zero status
          # aborted the whole job. Python's zipfile has no such behaviour, is
          # present on every runner, and lets us normalise the separators.
          mkdir -p daemon-extracted
          PY=$(command -v python3 || command -v python)
          if [ -z "$PY" ]; then
            echo "ERROR: neither python3 nor python found on PATH; cannot extract $archive"
            exit 1
          fi
          case "$archive" in
            *.tar.gz) tar -xzf "$archive" -C daemon-extracted ;;
            *.zip)
              "$PY" - "$archive" <<'EOF'
          import os, sys, zipfile
          archive = sys.argv[1]
          dest = "daemon-extracted"
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  if name.endswith("/"):
                      os.makedirs(os.path.join(dest, name), exist_ok=True)
                      continue
                  target = os.path.join(dest, name)
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  with z.open(info) as src, open(target, "wb") as out:
                      out.write(src.read())
          print("extracted", archive, "->", dest)
          EOF
              ;;
          esac

          # Locate the daemon binary anywhere inside the extracted tree.
          daemon_src=$(find daemon-extracted -type f -name "${{ matrix.daemon_bin }}" | head -1)
          if [ -z "$daemon_src" ]; then
            echo "ERROR: ${{ matrix.daemon_bin }} not found inside $(basename "$archive"). Cannot stage daemon binary."
            exit 1
          fi
          cp "$daemon_src" "${{ matrix.stage_dir }}/${{ matrix.daemon_bin }}"
          # Mac and linux binaries must be executable.
          chmod +x "${{ matrix.stage_dir }}/${{ matrix.daemon_bin }}"
          echo "Staged $daemon_src -> ${{ matrix.stage_dir }}/${{ matrix.daemon_bin }}"

          # Copy Tor bundle if present in the archive (optional but expected).
          tor_src=$(find daemon-extracted -type d -name "Tor" | head -1)
          if [ -n "$tor_src" ]; then
            cp -r "$tor_src" "${{ matrix.stage_dir }}/Tor"
            echo "Staged Tor bundle -> ${{ matrix.stage_dir }}/Tor"
          else
            echo "No Tor directory found in archive; skipping Tor bundle staging."
          fi

      - name: Verify daemon binary is staged (fail fast if missing)
        shell: bash
        run: |
          daemon_path="${{ matrix.stage_dir }}/${{ matrix.daemon_bin }}"
          if [ ! -f "$daemon_path" ]; then
            echo "FATAL: $daemon_path does not exist. Expected daemon asset matching '${{ matrix.daemon_pattern }}'. Daemon staging failed."
            exit 1
          fi
          echo "Daemon binary confirmed at $daemon_path"

      - name: Build installer
        shell: bash
        run: npm run ${{ matrix.build_script }}
        env:
          # Code-signing is optional. Provide both secrets to enable signing.
          # Without them electron-builder builds an unsigned installer.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # All three OS jobs publish into the same release tag so users find
      # win + mac + linux installers together in one release.
      - name: Publish to GitHub Release
        # pin to a full commit SHA for stricter supply-chain hardening
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "ALIAS Wallet ${{ steps.tag.outputs.tag }}"
          prerelease: true
          files: ${{ matrix.artifact_glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
