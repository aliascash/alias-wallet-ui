# DECISION LOG
# Trigger: push to main + workflow_dispatch (swap to workflow_run/repository_dispatch once daemon CI is live).
# Daemon: by default the newest Build<n> prerelease from the daemon repo's dev branch.
#   Pin a specific build with the daemon_tag input or the DAEMON_TAG repo variable when
#   cutting a release, so that build is reproducible.
#   Daemon assets are named ALIAS-<release>-<sha>-Win64.zip / Win32.zip / Mac.zip /
#   Mac-arm64.zip / Linux.zip.
# Signing: optional — CSC_LINK + CSC_KEY_PASSWORD enable it; unsigned builds trigger SmartScreen/Gatekeeper warnings.
# Auth: GITHUB_TOKEN covers this repo; swap GH_TOKEN to a PAT (secrets.DAEMON_REPO_PAT) if daemon repo is private/cross-org.

name: Build and Release Installers

on:
  push:
    branches:
      # `main` on the standalone desktop repo; `electron-desktop` is the branch
      # this codebase lives on in aliascash/alias-wallet-ui.
      - main
      - electron-desktop
  workflow_dispatch:
    inputs:
      daemon_tag:
        description: >-
          Daemon release tag to bundle (e.g. Build67). Leave empty to use the
          repo variable DAEMON_TAG, else the newest Build<n> daemon prerelease.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # electron_arch is passed to electron-builder explicitly: the runner
          # architecture must not decide what gets built, because the daemon
          # staged below is downloaded per arch and has to match.
          - os: windows-latest
            label: win-x64
            electron_arch: x64
            unpacked_dir: dist/win-unpacked
            iss_arch: x64
            daemon_pattern: "*Win64.zip"
            stage_dir: resources/win32/x64
            daemon_bin: aliaswalletd.exe
            build_script: build:win
            artifact_glob: "dist/ALIAS-Setup-*-x64.exe"

          - os: windows-latest
            label: win-x86
            electron_arch: ia32
            unpacked_dir: dist/win-ia32-unpacked
            iss_arch: x86
            daemon_pattern: "*Win32.zip"
            stage_dir: resources/win32/ia32
            daemon_bin: aliaswalletd.exe
            build_script: build:win
            artifact_glob: "dist/ALIAS-Setup-*-x86.exe"

          - os: macos-15-intel
            label: mac-x64
            electron_arch: x64
            daemon_pattern: "*Mac.zip"
            stage_dir: resources/darwin/x64
            daemon_bin: aliaswalletd
            build_script: build:mac
            artifact_glob: "dist/*x64.dmg"

          - os: macos-latest
            label: mac-arm64
            electron_arch: arm64
            daemon_pattern: "*Mac-arm64.zip"
            stage_dir: resources/darwin/arm64
            daemon_bin: aliaswalletd
            build_script: build:mac
            artifact_glob: "dist/*arm64.dmg"

          - os: ubuntu-latest
            label: linux-x64
            electron_arch: x64
            daemon_pattern: "*Linux.zip"
            stage_dir: resources/linux/x64
            daemon_bin: aliaswalletd
            build_script: build:linux
            # multiline so softprops/action-gh-release (splits files on newlines) uploads both
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    env:
      # The daemon repo is separate, so the repo-scoped
      # GITHUB_TOKEN cannot read its releases. Use a PAT (repo:read on
      # the daemon repo) stored as secret DAEMON_REPO_PAT; fall back to
      # GITHUB_TOKEN only if the PAT is unset (same-repo/public case).
      GH_TOKEN: ${{ secrets.DAEMON_REPO_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      # Stage the daemon binary before electron-builder runs so that the
      # extraResources rule copies it into the packaged app's daemon/ directory.
      # The path resources/${platform}/${arch}/ matches the electron-builder config:
      #   from: "resources/${platform}/${arch}" -> to: "daemon"
      # `gh release download` with no --tag resolves to the repo's *latest*
      # release, which excludes prereleases. The daemon's develop pipeline
      # publishes prereleases (Build<n>), so without an explicit tag this
      # silently bundles the last full release (4.4.x) instead of the build
      # the UI was tested against. Resolve the tag explicitly.
      - name: Resolve daemon release tag
        id: daemon_tag
        shell: bash
        run: |
          tag="${{ inputs.daemon_tag || vars.DAEMON_TAG }}"
          if [ -z "$tag" ]; then
            # Newest daemon build from the dev branch. Deliberately not
            # `gh release view`: that returns the latest FULL release, which is
            # a 4.4.x Qt build from master with no Mac.zip and a daemon from the
            # other stack. Daemon builds are prereleases tagged Build<run number>,
            # and the releases API returns newest first.
            # Newest Build that actually HAS this platform's asset. Picking
            # merely the newest tag is wrong: the daemon's prepareRelease job
            # creates the release before the platform jobs upload to it, so a
            # build still in flight appears as an empty Build<n> and every
            # download here fails.
            suffix='${{ matrix.daemon_pattern }}'; suffix="${suffix#\*}"
            tag=$(gh api "repos/${{ vars.DAEMON_REPO || 'aliascash/alias-wallet' }}/releases" \
                  | jq -r --arg s "$suffix" '[ .[]
                        | select(.prerelease)
                        | select(.tag_name | test("^Build[0-9]+$"))
                        | select(any(.assets[]; .name | endswith($s)))
                        | .tag_name ][0]')
            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              echo "ERROR: no Build<n> daemon prerelease has an asset matching ${{ matrix.daemon_pattern }}."
              echo "Publish one from the dev branch, or pin a tag with the daemon_tag input."
              exit 1
            fi
            echo "Using latest daemon build: $tag"
          else
            echo "Using pinned daemon tag: $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download daemon release asset
        shell: bash
        run: |
          gh release download "${{ steps.daemon_tag.outputs.tag }}" \
            --repo ${{ vars.DAEMON_REPO || 'aliascash/alias-wallet' }} \
            --pattern "${{ matrix.daemon_pattern }}" \
            --dir daemon-asset

      - name: Stage daemon binary
        shell: bash
        run: |
          mkdir -p "${{ matrix.stage_dir }}"

          # Find the downloaded archive (zip or tar.gz).
          archive=$(find daemon-asset -type f \( -name "*.zip" -o -name "*.tar.gz" \) | head -1)
          if [ -z "$archive" ]; then
            echo "ERROR: no archive found in daemon-asset/ matching ${{ matrix.daemon_pattern }}"
            exit 1
          fi

          # Extract into a staging directory.
          #
          # Do not extract zips with `unzip`. The Windows daemon archive is
          # built by PowerShell Compress-Archive, which writes entry names with
          # BACKSLASH separators ("ALIAS\\aliaswalletd.exe"). Info-ZIP on the
          # Windows runner prints
          #     warning: ... appears to use backslashes as path separators
          # and returns exit status 1 ("warning error") even though extraction
          # succeeded. This step runs under `bash -e`, so that non-zero status
          # aborted the whole job. Python's zipfile has no such behaviour, is
          # present on every runner, and lets us normalise the separators.
          mkdir -p daemon-extracted
          PY=$(command -v python3 || command -v python)
          if [ -z "$PY" ]; then
            echo "ERROR: neither python3 nor python found on PATH; cannot extract $archive"
            exit 1
          fi
          case "$archive" in
            *.tar.gz) tar -xzf "$archive" -C daemon-extracted ;;
            *.zip)
              "$PY" - "$archive" <<'EOF'
          import os, sys, zipfile
          archive = sys.argv[1]
          dest = "daemon-extracted"
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  if name.endswith("/"):
                      os.makedirs(os.path.join(dest, name), exist_ok=True)
                      continue
                  target = os.path.join(dest, name)
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  with z.open(info) as src, open(target, "wb") as out:
                      out.write(src.read())
                  # zipfile does not restore permissions, so an extracted
                  # Tor/tor.real would land as 0644 and fail to exec. Windows
                  # zips carry no unix mode (0), so this is a no-op there.
                  mode = info.external_attr >> 16
                  if mode:
                      os.chmod(target, mode & 0o777)
          print("extracted", archive, "->", dest)
          EOF
              ;;
          esac

          # Locate the daemon binary anywhere inside the extracted tree.
          daemon_src=$(find daemon-extracted -type f -name "${{ matrix.daemon_bin }}" | head -1)
          if [ -z "$daemon_src" ]; then
            echo "ERROR: ${{ matrix.daemon_bin }} not found inside $(basename "$archive"). Cannot stage daemon binary."
            exit 1
          fi
          cp "$daemon_src" "${{ matrix.stage_dir }}/${{ matrix.daemon_bin }}"
          # Mac and linux binaries must be executable.
          chmod +x "${{ matrix.stage_dir }}/${{ matrix.daemon_bin }}"
          echo "Staged $daemon_src -> ${{ matrix.stage_dir }}/${{ matrix.daemon_bin }}"

          # The Windows daemon is dynamically linked (MSVC runtime, Boost,
          # OpenSSL, BerkeleyDB). Stage the DLLs it imports, following imports
          # through the DLLs themselves, so it can start on a clean machine.
          "$PY" - "$daemon_src" "${{ matrix.stage_dir }}" <<'EOF'
          import os, re, shutil, sys
          exe, stage = sys.argv[1], sys.argv[2]
          d = os.path.dirname(exe)
          have = {f.lower(): f for f in os.listdir(d) if f.lower().endswith('.dll')}
          def imports(path):
              return {m.decode().lower() for m in re.findall(rb'[A-Za-z0-9_\-]+\.dll', open(path, 'rb').read())}
          todo, done = imports(exe), set()
          while todo:
              n = todo.pop()
              if n in done or n not in have:
                  continue
              done.add(n)
              todo |= imports(os.path.join(d, have[n]))
          for n in sorted(done):
              shutil.copy2(os.path.join(d, have[n]), stage)
              print("Staged DLL", have[n])
          print("Staged", len(done), "DLLs")
          EOF

          # Copy Tor bundle if present in the archive (optional but expected).
          tor_src=$(find daemon-extracted -type d -name "Tor" | head -1)
          if [ -n "$tor_src" ]; then
            cp -r "$tor_src" "${{ matrix.stage_dir }}/Tor"
            # Belt and braces: the daemon cannot launch a non-executable Tor.
            for t in tor.real tor tor.exe; do
              [ -f "${{ matrix.stage_dir }}/Tor/$t" ] && chmod +x "${{ matrix.stage_dir }}/Tor/$t"
            done
            if [ -d "${{ matrix.stage_dir }}/Tor/PluggableTransports" ]; then
              chmod +x "${{ matrix.stage_dir }}"/Tor/PluggableTransports/* || true
            fi
            echo "Staged Tor bundle -> ${{ matrix.stage_dir }}/Tor"
          else
            echo "No Tor directory found in archive; skipping Tor bundle staging."
          fi

      - name: Verify daemon binary is staged (fail fast if missing)
        shell: bash
        run: |
          daemon_path="${{ matrix.stage_dir }}/${{ matrix.daemon_bin }}"
          if [ ! -f "$daemon_path" ]; then
            echo "FATAL: $daemon_path does not exist. Expected daemon asset matching '${{ matrix.daemon_pattern }}'. Daemon staging failed."
            exit 1
          fi
          echo "Daemon binary confirmed at $daemon_path"

      # Code-signing is optional. Provide both secrets to enable signing.
      # They must not be exported when unset: electron-builder treats a DEFINED
      # but empty CSC_LINK as a certificate path, resolves it to the workspace
      # and dies with "<workspace> not a file". So pass them under different
      # names and only export the real ones when a certificate is actually set.
      - name: Build installer
        shell: bash
        env:
          CSC_LINK_IN: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_IN: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK_IN" ]; then
            echo "Code-signing certificate present; building signed."
            export CSC_LINK="$CSC_LINK_IN"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_IN"
          else
            echo "No code-signing certificate; building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run ${{ matrix.build_script }} -- --${{ matrix.electron_arch }}

      # electron-builder only produces the unpacked app on Windows; Inno Setup
      # turns it into the installer. Inno is preinstalled on the runner image
      # (6.7.1), which is new enough for the built-in download/extractarchive
      # flags -- no InnoDownloadPlugin needed.
      - name: Build Windows installer with Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $app = "build/installer/app"
          if (Test-Path $app) { Remove-Item $app -Recurse -Force }
          New-Item -ItemType Directory -Path $app -Force | Out-Null
          Copy-Item "${{ matrix.unpacked_dir }}/*" $app -Recurse -Force

          $iscc = Join-Path (Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Directory |
                             Select-Object -First 1).FullName "ISCC.exe"
          & $iscc "/DArch=${{ matrix.iss_arch }}" "/DMyAppVersion=$version" "build/installer/ALIAS.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

          $out = "dist/ALIAS-Setup-$version-${{ matrix.iss_arch }}.exe"
          if (-not (Test-Path $out)) { throw "Installer not produced at $out" }
          "{0:N1} MB  {1}" -f ((Get-Item $out).Length / 1MB), $out

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # All three OS jobs publish into the same release tag so users find
      # win + mac + linux installers together in one release.
      - name: Publish to GitHub Release
        # pin to a full commit SHA for stricter supply-chain hardening
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "ALIAS Wallet ${{ steps.tag.outputs.tag }}"
          prerelease: true
          files: ${{ matrix.artifact_glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
