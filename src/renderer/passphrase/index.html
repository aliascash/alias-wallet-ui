<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Passphrase Dialog</title>
  <link rel="stylesheet" href="passphrase.css">
</head>
<body>
  <main class="dialog">
    <!-- warningLabel — populated per mode. Supports HTML (Qt's RichText). -->
    <p class="warning" id="warning"></p>

    <!-- Three rows: passLabel1/passEdit1, passLabel2/passEdit2, passLabel3/passEdit3.
         Original .ui defines them with these exact labels. -->
    <div class="row" id="row-pass1">
      <label for="pass1" id="passLabel1">Enter passphrase</label>
      <input type="password" id="pass1" autocomplete="off">
    </div>

    <div class="row" id="row-pass2" hidden>
      <label for="pass2" id="passLabel2">New passphrase</label>
      <input type="password" id="pass2" autocomplete="off">
    </div>

    <div class="row" id="row-pass3" hidden>
      <label for="pass3" id="passLabel3">Repeat new passphrase</label>
      <input type="password" id="pass3" autocomplete="off">
    </div>

    <p id="capsLabel" class="caps-label"></p>

    <label class="staking-row" id="stakingRow" hidden
           title="Serves to disable the trivial sendmoney when OS account compromised. Provides no real security.">
      <input type="checkbox" id="stakingCheckBox">
      <span id="stakingText">For staking only</span>
    </label>

    <footer>
      <button id="btn-cancel" class="btn">Cancel</button>
      <button id="btn-ok" class="btn btn-default-action" disabled>OK</button>
    </footer>
  </main>

  <script src="passphrase.js"></script>
</body>
</html>
